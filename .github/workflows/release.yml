name: GitHub Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify tag and project version
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              project = tomllib.load(stream)["project"]

          tag = os.environ["GITHUB_REF_NAME"]
          expected_tag = f"v{project['version']}"

          if project["name"] != "memoket-kite":
              raise SystemExit(f"unexpected project name: {project['name']}")
          if tag != expected_tag:
              raise SystemExit(
                  f"tag {tag} does not match project version {expected_tag}"
              )
          PY
      - name: Create draft release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi

          if gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --draft; then
            exit 0
          fi

          gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null
