name: Benchmark reproduction
description: Report a discrepancy from a benchmark reproduction run
title: "[Reproduction]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove credentials and do not attach raw benchmark datasets.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I followed the repository's benchmark reproduction instructions.
          required: true
        - label: I searched the existing issues for this discrepancy.
          required: true
  - type: input
    id: commit
    attributes:
      label: KITE commit
    validations:
      required: true
  - type: dropdown
    id: benchmark
    attributes:
      label: Benchmark
      options: [LoCoMo, LongMemEval cleaned]
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Manifest and hashes
      description: Paste the dataset revision and SHA256, model IDs, and local manifest or artifact hashes.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Commands and output
    validations:
      required: true
  - type: textarea
    id: discrepancy
    attributes:
      label: Observed discrepancy
      description: Include both the expected and observed result.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and relevant package versions.
    validations:
      required: true
